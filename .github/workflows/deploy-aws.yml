name: Deploy AWS

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'feature/')
    runs-on: [self-hosted, linux, x64, rds-runner]
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        run: terraform init -input=false -backend=false
      - name: Terraform fmt check
        run: terraform fmt -check -recursive
      - name: Terraform validate
        run: terraform validate

  open-pr:
    if: github.event_name == 'push' && startsWith(github.ref_name, 'feature/')
    needs: validate
    runs-on: [self-hosted, linux, x64, rds-runner]
    steps:
      - name: Open pull request to main
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const head = `${owner}:${context.ref.replace('refs/heads/', '')}`;
            const existing = await github.rest.pulls.list({
              owner,
              repo,
              head,
              base: 'main',
              state: 'open'
            });

            if (existing.data.length === 0) {
              await github.rest.pulls.create({
                owner,
                repo,
                head,
                base: 'main',
                title: `Deploy ${context.ref.replace('refs/heads/', '')}`,
                body: 'PR criado automaticamente após a validação Terraform da feature.'
              });
            }

  deploy:
    if: (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) || (github.event_name == 'workflow_dispatch' && github.ref_name == 'main')
    needs: validate
    runs-on: [self-hosted, linux, x64, rds-runner]
    environment: production
    defaults:
      run:
        working-directory: src
    env:
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_db_password: ${{ secrets.TF_VAR_RDS_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check AWS session
        run: aws sts get-caller-identity
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        run: terraform init -input=false
      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan
      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan
